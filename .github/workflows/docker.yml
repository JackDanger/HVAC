name: Docker

# Build + publish multi-arch container images to GHCR.
#
# - main pushes        → ghcr.io/jackdanger/hvac:main + :latest + :sha-<short>
# - tag pushes (v*)    → ghcr.io/jackdanger/hvac:<X.Y.Z> + :<X.Y> + :latest
# - PRs                → verify-only (no push), so the Dockerfile doesn't
#                        rot silently. PR build runs in a separate job
#                        with read-only permissions.
#
# `:latest` tracks the newest successful build on main; tag pushes
# overwrite it with the released version. README + docs/NAS.md +
# compose.example.yml all pull `:latest`, so this is the tag a brand-new
# Reddit visitor needs to resolve on the day this PR merges (well before
# the next semver tag lands).
#
# The publish path builds linux/amd64 + linux/arm64. The arm64 build
# matters: most modern Synology / QNAP boxes are aarch64, and so is
# Apple Silicon for the docker-on-Mac crowd. QEMU emulation is enough
# for Rust + apt and avoids juggling a self-hosted aarch64 runner. PR
# verify is amd64-only — see the comment on that job for the rationale.

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]
    paths:
      - "Dockerfile"
      - ".dockerignore"
      - "Cargo.toml"
      - "Cargo.lock"
      - "src/**"
      - ".github/workflows/docker.yml"

# Default to read-only at the workflow scope; the publish job below
# upgrades to packages:write. PR builds run in the verify job, which
# inherits read-only.
permissions:
  contents: read

concurrency:
  group: docker-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # PR builds: confirm the Dockerfile still produces a buildable image.
  # amd64 only — arm64 emulation via QEMU adds ~15min for a marginal
  # signal (the apt branch is the only platform-conditional thing, and
  # both branches are visible in the Dockerfile review). The publish
  # job below catches any arm-specific breakage post-merge before the
  # image hits GHCR. Never logs into GHCR, never gets packages:write.
  verify:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v6
      - name: Set up Buildx
        uses: docker/setup-buildx-action@v4
      # Load the amd64 image into the local daemon (rather than discarding
      # it with push: false) so the smoke test below can actually run it. A
      # plain build only proves the Dockerfile compiles; it can't catch a
      # binary that crashes on start, a missing ffmpeg, or a wrong UID — all
      # things the README promises a user. load: true requires a single
      # platform, which is why this stays amd64-only (see job comment above).
      - name: Build (amd64, load into daemon)
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64
          push: false
          load: true
          tags: hvac:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
      # Assert the README/Dockerfile contract against the just-built image
      # so a regression fails the PR instead of silently shipping to GHCR.
      - name: Smoke test the image
        run: ./scripts/docker-smoke.sh hvac:ci

  # Push builds: main + tag pushes. Distinct job so packages:write only
  # lives on the path that actually needs it.
  publish:
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v6

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3
      - name: Set up Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Compute tags + labels
        id: meta
        uses: docker/metadata-action@v6
        with:
          # GHCR lowercases the org/owner segment regardless of how it's
          # written in the repo URL; using github.repository_owner directly
          # works as long as it's lowercase. Pinning to a literal here
          # avoids capitalisation drift between the repo (JackDanger/HVAC)
          # and the image (jackdanger/hvac).
          images: ghcr.io/jackdanger/hvac
          tags: |
            type=ref,event=branch
            type=sha,prefix=sha-,format=short
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            # :latest tracks main and (later) tag pushes. The default
            # docker/metadata-action 'latest' tag fires only on the
            # default branch + on semver tags, which is exactly the
            # behaviour we want — explicit here so the contract is
            # visible in the workflow file rather than implicit in the
            # action's defaults.
            type=raw,value=latest,enable=${{ github.ref == format('refs/heads/{0}', github.event.repository.default_branch) || startsWith(github.ref, 'refs/tags/v') }}

      - name: Build + push
        id: build
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # GHA build cache: writes to /tmp; reads from the same on cache
          # hits. First build is full, subsequent builds within the cache
          # TTL skip the apt + cargo layers. The verify job also writes
          # to the same cache so PR builds warm it for the publish run
          # that follows the merge.
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # Prove the artifact that just landed on GHCR is multi-arch. The
      # README points NAS (aarch64) and Apple Silicon users at this image,
      # so a publish that silently dropped arm64 would break them. Pin to
      # the immutable index digest from the build step rather than a moving
      # tag so this checks exactly what we pushed.
      - name: Verify pushed image is multi-arch (amd64 + arm64)
        run: |
          ref="ghcr.io/jackdanger/hvac@${{ steps.build.outputs.digest }}"
          echo "inspecting $ref"
          platforms="$(docker buildx imagetools inspect "$ref" \
            --format '{{range .Manifest.Manifests}}{{println .Platform.OS "/" .Platform.Architecture}}{{end}}')"
          echo "$platforms"
          echo "$platforms" | grep -q "linux / amd64" || { echo "missing linux/amd64"; exit 1; }
          echo "$platforms" | grep -q "linux / arm64" || { echo "missing linux/arm64"; exit 1; }

      # Pull the just-pushed image back from GHCR (by digest) and run the
      # same contract checks the PR ran. This is the end-to-end guarantee
      # that what users `docker pull` actually works — registry round-trip
      # included, not just the local build. The runner is amd64, so this
      # exercises the amd64 variant of the multi-arch index.
      - name: Smoke test the pushed image
        run: ./scripts/docker-smoke.sh "ghcr.io/jackdanger/hvac@${{ steps.build.outputs.digest }}"
